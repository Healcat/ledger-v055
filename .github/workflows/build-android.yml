name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor deps
        run: npm install

      - name: Build web bundle (merge single-file)
        run: node merge_v055.js

      - name: Prepare www/ for Capacitor
        run: |
          mkdir -p www
          cp 记账本_fitWMV055.html www/index.html
          cp manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/ 2>/dev/null || true

      - name: Capacitor add android (generate native project)
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi

      - name: Capacitor sync web assets
        run: npx cap sync android

      - name: Setup Java (JDK 17 for AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Point gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK (only if secrets are configured)
        if: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Publish APK to continuous Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Continuous build (auto)"
          prerelease: true
          overwrite: true
          files: android/app/build/outputs/apk/release/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
